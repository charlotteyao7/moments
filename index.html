<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Charlotte Yao</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='25' fill='%23f4f1ea'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Source+Sans+3:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --mist: #f4f1ea;
      --ink-on-grey: #f7f4ee;
      --muted-on-grey: rgba(247, 244, 238, 0.82);
      --link: #f7f4ee;
      --text-shadow: 0 1px 2px rgba(40, 44, 40, 0.18), 0 2px 12px rgba(40, 44, 40, 0.14);
    }

    html, body {
      height: 100%;
    }

    body {
      min-height: 100vh;
      font-family: 'Source Sans 3', sans-serif;
      color: var(--ink-on-grey);
      overflow: hidden;
    }

    .hero-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: #8d8f90;
    }

    .hero-video {
      position: fixed;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .hero-video.has-source {
      display: block;
    }

    .ripple-canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .ripple-canvas.ready {
      opacity: 1;
    }

    .mist {
      position: fixed;
      inset: -20%;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 18% 40%, rgba(244, 241, 234, 0.12), transparent 46%),
        radial-gradient(ellipse at 78% 70%, rgba(197, 206, 192, 0.1), transparent 50%);
      animation: drift 28s ease-in-out infinite alternate;
    }

    @keyframes drift {
      from { transform: translate3d(-2%, -1%, 0); }
      to { transform: translate3d(3%, 2%, 0); }
    }

    .intro {
      position: relative;
      z-index: 3;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      padding: 8vh 11vw;
      max-width: 42rem;
      text-shadow: var(--text-shadow);
    }

    h1 {
      font-family: 'EB Garamond', serif;
      font-weight: 400;
      font-size: clamp(2.4rem, 4.2vw, 3.35rem);
      letter-spacing: 0.01em;
      line-height: 1.15;
      margin-bottom: 1.15rem;
    }

    .bio {
      font-weight: 300;
      font-size: clamp(1.05rem, 1.6vw, 1.22rem);
      line-height: 1.55;
      color: var(--muted-on-grey);
    }

    .bio p + p {
      margin-top: 0.15rem;
    }

    .links {
      margin-top: 1.35rem;
      font-weight: 300;
      font-size: clamp(1.05rem, 1.6vw, 1.22rem);
      color: var(--muted-on-grey);
    }

    a {
      color: var(--link);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 0.22em;
      transition: opacity 0.4s ease;
    }

    a:hover {
      opacity: 0.7;
    }

    @media (max-width: 700px) {
      .intro {
        padding: 8vh 8vw;
      }
    }
  </style>
</head>
<body>
  <div class="hero-bg" aria-hidden="true"></div>
  <video class="hero-video" id="bg-video" autoplay muted loop playsinline>
    <source src="./video/background.mp4" type="video/mp4" />
  </video>
  <div class="mist" aria-hidden="true"></div>

  <main class="intro">
    <div>
      <h1>charlotte yao</h1>
      <div class="bio">
        <p>student at ucla<br />incoming at boston consulting group</p>
        <p>enjoyer of <a href="./photography.html">adventure</a> & conversation</p>
      </div>
      <p class="links">
        say hello on <a href="https://www.linkedin.com/in/charlotteyao27" target="_blank" rel="noopener noreferrer">linkedin</a>
        or <a href="mailto:charlotteyao27@gmail.com">email</a>
      </p>
    </div>
  </main>

  <script>
    const video = document.getElementById('bg-video');
    const source = video.querySelector('source');
    if (source && source.getAttribute('src')) {
      video.classList.add('has-source');
    }

    // Water ripples: redraws the video through a WebGL canvas that bends it
    // around the cursor. If WebGL or the video texture is unavailable, the
    // canvas is removed and the plain video shows as before.
    (function ripples() {
      if (!video.classList.contains('has-source')) return;
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      const canvas = document.createElement('canvas');
      canvas.className = 'ripple-canvas';
      canvas.setAttribute('aria-hidden', 'true');
      const gl = canvas.getContext('webgl', { alpha: false, antialias: false });
      if (!gl) return;
      video.after(canvas);

      const MAX = 24;
      const vert = `
        attribute vec2 aPos;
        void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
      `;
      const frag = `
        precision mediump float;
        uniform sampler2D uTex;
        uniform vec2 uRes;
        uniform vec2 uVid;
        uniform float uTime;
        uniform float uDpr;
        uniform vec4 uRipples[${MAX}]; // x, y (device px, y up), start time, strength

        const float LIFE = 1.6;   // seconds
        const float SPEED = 150.0; // css px / s
        const float WIDTH = 20.0;  // css px
        const float WAVE = 24.0;   // css px wavelength
        const float AMP = 5.0;     // css px of displacement

        vec3 sampleCover(vec2 p) {
          float s = max(uRes.x / uVid.x, uRes.y / uVid.y);
          vec2 uv = (p - uRes * 0.5) / (uVid * s) + 0.5;
          uv.y = 1.0 - uv.y;
          return texture2D(uTex, clamp(uv, 0.0, 1.0)).rgb;
        }

        void main() {
          vec2 p = gl_FragCoord.xy;
          vec2 offset = vec2(0.0);
          float shade = 0.0;

          for (int i = 0; i < ${MAX}; i++) {
            vec4 r = uRipples[i];
            if (r.w <= 0.0) continue;
            float age = uTime - r.z;
            if (age < 0.0 || age > LIFE) continue;

            vec2 d = (p - r.xy) / uDpr;
            float dist = length(d);
            float x = dist - age * SPEED * (0.6 + 0.4 * r.w);
            float band = exp(-(x * x) / (WIDTH * WIDTH));
            float fade = 1.0 - age / LIFE;
            float wave = sin(x * 6.2831 / WAVE) * band * fade * fade * r.w;

            if (dist > 0.001) offset += (d / dist) * wave;
            shade += wave;
          }

          offset *= AMP * uDpr;
          // Faint prism: red and blue bend slightly more and less than green.
          vec3 col = vec3(
            sampleCover(p + offset * 1.25).r,
            sampleCover(p + offset).g,
            sampleCover(p + offset * 0.75).b
          );
          col += shade * 0.035;
          gl_FragColor = vec4(col, 1.0);
        }
      `;

      function compile(type, src) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        return gl.getShaderParameter(s, gl.COMPILE_STATUS) ? s : null;
      }
      const vs = compile(gl.VERTEX_SHADER, vert);
      const fs = compile(gl.FRAGMENT_SHADER, frag);
      const prog = gl.createProgram();
      if (!vs || !fs) { canvas.remove(); return; }
      gl.attachShader(prog, vs);
      gl.attachShader(prog, fs);
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { canvas.remove(); return; }
      gl.useProgram(prog);

      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
      const aPos = gl.getAttribLocation(prog, 'aPos');
      gl.enableVertexAttribArray(aPos);
      gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

      const tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

      const u = {};
      ['uRes', 'uVid', 'uTime', 'uDpr', 'uRipples'].forEach((n) => {
        u[n] = gl.getUniformLocation(prog, n);
      });

      let dpr = 1;
      // Checked every frame, so it also catches a page that loads at 0x0.
      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 1.5);
        const w = Math.round(window.innerWidth * dpr);
        const h = Math.round(window.innerHeight * dpr);
        if (w === canvas.width && h === canvas.height) return;
        canvas.width = w;
        canvas.height = h;
        gl.viewport(0, 0, w, h);
      }

      const ripples = new Float32Array(MAX * 4);
      let next = 0;
      const start = performance.now();
      const now = () => (performance.now() - start) / 1000;

      function addRipple(clientX, clientY, strength) {
        const i = next * 4;
        ripples[i] = clientX * dpr;
        ripples[i + 1] = canvas.height - clientY * dpr;
        ripples[i + 2] = now();
        ripples[i + 3] = strength;
        next = (next + 1) % MAX;
      }

      // Trail: one ripple per ~40px of movement, so it stays calm.
      let lastX = null;
      let lastY = null;
      window.addEventListener('pointermove', (e) => {
        if (lastX === null || Math.hypot(e.clientX - lastX, e.clientY - lastY) >= 40) {
          addRipple(e.clientX, e.clientY, 0.6);
          lastX = e.clientX;
          lastY = e.clientY;
        }
      }, { passive: true });
      // Click or tap: a bigger splash.
      window.addEventListener('pointerdown', (e) => {
        addRipple(e.clientX, e.clientY, 1.4);
        lastX = e.clientX;
        lastY = e.clientY;
      }, { passive: true });

      function frame() {
        resize();
        if (video.readyState >= 2 && canvas.width > 0 && canvas.height > 0) {
          try {
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, video);
          } catch (err) {
            // The browser won't hand the video to WebGL (e.g. opened via file://).
            canvas.remove();
            return;
          }
          gl.uniform2f(u.uRes, canvas.width, canvas.height);
          gl.uniform2f(u.uVid, video.videoWidth, video.videoHeight);
          gl.uniform1f(u.uTime, now());
          gl.uniform1f(u.uDpr, dpr);
          gl.uniform4fv(u.uRipples, ripples);
          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
          canvas.classList.add('ready');
        }
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })();

    // Water sound: the video's own audio, routed through a gain node so it
    // can swell quietly while the visitor moves or taps, then fade to silence.
    // Browsers only allow sound after a click, tap or key press, so the cursor
    // brings it in only after that first gesture.
    (function waterSound() {
      if (!video.classList.contains('has-source')) return;
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;

      const PEAK = 0.15;
      let ctx = null;
      let gain = null;
      let rising = false;
      let idle = null;

      function setup() {
        ctx = new AudioCtx();
        gain = ctx.createGain();
        gain.gain.value = 0;
        ctx.createMediaElementSource(video).connect(gain).connect(ctx.destination);
        video.muted = false;
      }

      function ramp(to, seconds) {
        const t = ctx.currentTime;
        gain.gain.cancelScheduledValues(t);
        gain.gain.setValueAtTime(gain.gain.value, t);
        gain.gain.linearRampToValueAtTime(to, t + seconds);
      }

      function swell() {
        if (!ctx) return;
        if (!rising) {
          ramp(PEAK, 0.6);
          rising = true;
        }
        clearTimeout(idle);
        idle = setTimeout(() => {
          ramp(0, 1.5);
          rising = false;
        }, 2000);
      }

      function wake() {
        if (!ctx) {
          try { setup(); } catch (err) { return; }
        }
        if (ctx.state !== 'running') ctx.resume();
        if (video.paused) video.play().catch(() => {});
        swell();
      }

      // pointerup and keydown count as a user gesture on every browser,
      // including touch screens where pointerdown alone does not.
      ['pointerdown', 'pointerup', 'keydown'].forEach((type) => {
        window.addEventListener(type, wake, { passive: true });
      });
      window.addEventListener('pointermove', swell, { passive: true });
    })();
  </script>
</body>
</html>
