<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Charlotte Yao</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='25' fill='%23f4f1ea'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Source+Sans+3:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --mist: #f4f1ea;
      --ink-on-grey: #f7f4ee;
      --muted-on-grey: rgba(247, 244, 238, 0.82);
      --link: #f7f4ee;
    }

    html, body {
      height: 100%;
    }

    body {
      min-height: 100vh;
      font-family: 'Source Sans 3', sans-serif;
      color: var(--ink-on-grey);
      overflow: hidden;
    }

    .hero-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: #8d8f90;
    }

    .hero-video {
      position: fixed;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .hero-video.has-source {
      display: block;
    }

    .mist {
      position: fixed;
      inset: -20%;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 18% 40%, rgba(244, 241, 234, 0.12), transparent 46%),
        radial-gradient(ellipse at 78% 70%, rgba(197, 206, 192, 0.1), transparent 50%);
      animation: drift 28s ease-in-out infinite alternate;
    }

    @keyframes drift {
      from { transform: translate3d(-2%, -1%, 0); }
      to { transform: translate3d(3%, 2%, 0); }
    }

    .intro {
      position: relative;
      z-index: 3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 8vh 11vw;
      max-width: 42rem;
    }

    h1 {
      font-family: 'EB Garamond', serif;
      font-weight: 400;
      font-size: clamp(2.4rem, 4.2vw, 3.35rem);
      letter-spacing: 0.01em;
      line-height: 1.15;
      margin-bottom: 1.15rem;
    }

    .bio {
      font-weight: 300;
      font-size: clamp(1.05rem, 1.6vw, 1.22rem);
      line-height: 1.55;
      color: var(--muted-on-grey);
    }

    .bio p + p {
      margin-top: 0.15rem;
    }

    .links {
      margin-top: 1.35rem;
      font-weight: 300;
      font-size: clamp(1.05rem, 1.6vw, 1.22rem);
      color: var(--muted-on-grey);
    }

    a {
      color: var(--link);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 0.22em;
      transition: opacity 0.4s ease;
    }

    a:hover {
      opacity: 0.7;
    }

    @media (max-width: 700px) {
      .intro {
        padding: 10vh 8vw;
        align-items: flex-end;
        padding-bottom: 14vh;
      }
    }
  </style>
</head>
<body>
  <div class="hero-bg" aria-hidden="true"></div>
  <video class="hero-video" id="bg-video" autoplay muted loop playsinline>
    <source src="./video/background.mp4" type="video/mp4" />
  </video>
  <div class="mist" aria-hidden="true"></div>

  <main class="intro">
    <div>
      <h1>charlotte yao</h1>
      <div class="bio">
        <p>student at ucla<br />incoming at boston consulting group</p>
        <p>enjoyer of adventure & conversation</p>
      </div>
      <p class="links">
        check out my <a href="https://www.linkedin.com/in/charlotteyao27" target="_blank" rel="noopener noreferrer">linkedin</a>
        and <a href="./photography.html">photography</a>
      </p>
    </div>
  </main>

  <script>
    const video = document.getElementById('bg-video');
    const source = video.querySelector('source');
    if (source && source.getAttribute('src')) {
      video.classList.add('has-source');
    }
  </script>
</body>
</html>
